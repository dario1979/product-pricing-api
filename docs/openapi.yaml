openapi: 3.0.3
info:
  title: Product Pricing API
  version: 1.0.0
  description: REST API for products and additional prices in different currencies.
servers:
  - url: http://127.0.0.1:8000
tags:
  - name: Products
  - name: Product Prices
paths:
  /products:
    get:
      tags: [Products]
      summary: List products
      operationId: listProducts
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
    post:
      tags: [Products]
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      summary: Get a product by ID
      operationId: getProduct
      responses:
        '200':
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      summary: Replace a product
      description: All fields in ProductInput are required.
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Products]
      summary: Delete a product and its additional prices
      operationId: deleteProduct
      responses:
        '204':
          description: Product deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /products/{id}/prices:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Product Prices]
      summary: List additional prices for a product
      description: Returns explicitly registered prices. The base product price is not included automatically.
      operationId: listProductPrices
      responses:
        '200':
          description: Product prices retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPriceListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Product Prices]
      summary: Register an additional price for a product
      operationId: registerProductPrice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPriceInput'
      responses:
        '201':
          description: Product price registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPriceResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A price for this product and currency is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Numeric product identifier
      schema:
        type: integer
        minimum: 1
      example: 1
  responses:
    NotFound:
      description: Product not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
  schemas:
    Money:
      type: string
      description: Decimal amount; responses use two fractional digits.
      pattern: '^\d+(\.\d{1,2})?$'
      example: '120.00'
    ProductInput:
      type: object
      required:
        - name
        - description
        - price
        - currency_id
        - tax_cost
        - manufacturing_cost
      properties:
        name:
          type: string
          maxLength: 150
          minLength: 1
          example: Mechanical Keyboard
        description:
          type: string
          minLength: 1
          example: Mechanical keyboard
        price:
          $ref: '#/components/schemas/Money'
        currency_id:
          type: integer
          minimum: 1
          example: 1
        tax_cost:
          $ref: '#/components/schemas/Money'
        manufacturing_cost:
          $ref: '#/components/schemas/Money'
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              example: 1
    ProductPriceInput:
      type: object
      required: [currency_id, price]
      properties:
        currency_id:
          type: integer
          minimum: 1
          example: 2
        price:
          $ref: '#/components/schemas/Money'
    ProductPrice:
      allOf:
        - $ref: '#/components/schemas/ProductPriceInput'
        - type: object
          required: [id, product_id]
          properties:
            id:
              type: integer
              example: 3
            product_id:
              type: integer
              example: 1
    ProductResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Product'
    ProductListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    ProductPriceResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ProductPrice'
    ProductPriceListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductPrice'
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ValidationErrorResponse:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
